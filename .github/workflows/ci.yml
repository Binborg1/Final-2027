name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  database:
    name: Migrations and row-level security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/db
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.108.0
      # The CLI pulls pg_prove and postgres-meta from public.ecr.aws, whose anonymous
      # pulls hit "Data limit exceeded" on shared runners, and it has no fallback for
      # these two. Pull them from GitHub's registry and tag them with the names the
      # CLI looks for, so it finds them locally. The tags match CLI 2.108.0 above;
      # update both together.
      - name: Pull the test and type-generation images from ghcr.io
        run: |
          for image in pg_prove:3.36 postgres-meta:v0.96.1; do
            docker pull --quiet "ghcr.io/supabase/$image"
            docker tag "ghcr.io/supabase/$image" "public.ecr.aws/supabase/$image"
          done
      - name: Start Postgres and apply the migrations
        run: supabase db start
      - name: Run the pgTAP tests in db/supabase/tests
        run: supabase test db
      - name: Check src/lib/db/types.ts matches the migrations
        run: |
          supabase gen types typescript --local > "$RUNNER_TEMP/types.ts"
          diff -u ../src/lib/db/types.ts "$RUNNER_TEMP/types.ts"

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  database:
    name: Migrations and row-level security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/db
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.108.0
      - name: Start Postgres and apply the migrations
        run: supabase db start
      - name: Run the pgTAP tests in db/supabase/tests
        run: supabase test db
      - name: Check src/lib/db/types.ts matches the migrations
        run: |
          supabase gen types typescript --local > "$RUNNER_TEMP/types.ts"
          diff -u ../src/lib/db/types.ts "$RUNNER_TEMP/types.ts"

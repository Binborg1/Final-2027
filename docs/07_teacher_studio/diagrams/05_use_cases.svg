<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" class="dia" viewBox="0 0 1160 690" role="img" aria-label="Use case diagram. The teacher uses every group: account and courses, live, prepare. Students join with a QR or code, answer, see revealed answers and get materials. Google Classroom receives published posts. Use cases marked with a star are done by Funza and checked by the teacher."><style>svg{
  --bg: #f3f5f2;
  --card: #ffffff;
  --ink: #17212b;
  --muted: #586470;
  --line: #ced6d1;
  --live: #c9431d;
  --prep: #0b7469;
  --ai: #6a4bd6;
  --live-t: #fbebe5;
  --prep-t: #e2f1ee;
  --ai-t: #efebfc;
  --lane: #e9edea;
  --ok: #2c7a3a;   --ok-t: #e3f2e5;
  --warn: #9a6100; --warn-t: #fbf0dc;
  --none: #6b7580; --none-t: #eceff1;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;} svg{background:var(--card);} 

.dia text { font-family: var(--body); }
.bx rect { fill: var(--card); stroke: var(--line); stroke-width: 1.3; }
.bx.live rect { stroke: var(--live); }
.bx.prep rect { stroke: var(--prep); }
.bx.home rect { stroke: var(--ink); stroke-width: 1.6; }
.bx.ai rect { fill: var(--ai-t); stroke: var(--ai); stroke-dasharray: 5 3; }
.bx.stu rect { stroke: var(--ink); stroke-width: 1; }
.bx.ext rect { fill: var(--lane); stroke: var(--muted); stroke-dasharray: 3 3; }
.t { font-size: 12.5px; font-weight: 700; fill: var(--ink); }
.s { font-size: 11px; fill: var(--muted); }
.ar { fill: none; stroke: var(--muted); stroke-width: 1.4; }
.ar.dash { stroke-dasharray: 6 4; }
.ar.assoc { stroke: var(--ink); stroke-width: 1.1; }
.ahp { fill: var(--muted); }
.lb { fill: var(--card); stroke: var(--line); }
.lt { font-size: 10.5px; fill: var(--muted); }
.panel.live { fill: var(--live-t); }
.panel.prep { fill: var(--prep-t); }
.panel.stu { fill: none; stroke: var(--line); stroke-dasharray: 4 4; }
.plab { font-family: var(--display); font-size: 13px; font-weight: 800; letter-spacing: .08em; }
.plab.live { fill: var(--live); } .plab.prep { fill: var(--prep); } .plab.stu { fill: var(--ink); }
.pnote { font-size: 11.5px; fill: var(--muted); }
.lane { fill: none; }
.lane.l1 { fill: var(--lane); }
.lanel { font-family: var(--display); font-size: 14px; font-weight: 700; fill: var(--ink); }
.lanes { font-size: 10.5px; fill: var(--muted); }
.ph { font-size: 12px; font-weight: 700; fill: var(--ink); }
.st rect { fill: var(--bg); stroke: var(--line); }
.stt { font-size: 10.5px; fill: var(--muted); }
.sys { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.systitle { font-family: var(--display); font-size: 15px; font-weight: 800; fill: var(--ink); }
.grp { fill: none; stroke: var(--line); stroke-dasharray: 4 4; }
.gname { font-size: 12px; font-weight: 700; fill: var(--muted); letter-spacing: .04em; }
.uc ellipse { fill: var(--card); stroke: var(--ink); stroke-width: 1.1; }
.uc.ai ellipse { fill: var(--ai-t); stroke: var(--ai); }
.uct { font-size: 12px; fill: var(--ink); }
.ucn { font-size: 10.5px; fill: var(--muted); font-weight: 700; }
.aim { fill: var(--ai); }
.actor { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.aname { font-size: 13px; font-weight: 700; fill: var(--ink); }
</style><rect x="0" y="0" width="1160" height="690" fill="var(--card)"/><defs><marker id="ah-d4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="sys" x="130" y="12" width="840" height="666" rx="16"/><text class="systitle" x="150.0" y="36.0" text-anchor="start">Funza Teacher Studio</text><rect class="grp" x="146" y="48" width="808" height="100" rx="12"/><text class="gname" x="162.0" y="68.0" text-anchor="start">Account and courses</text><rect class="grp" x="146" y="160" width="808" height="244" rx="12"/><text class="gname" x="162.0" y="180.0" text-anchor="start">Live</text><rect class="grp" x="146" y="416" width="808" height="250" rx="12"/><text class="gname" x="162.0" y="436.0" text-anchor="start">Prepare</text><g class="uc"><ellipse cx="226.8" cy="110" rx="74" ry="25"/><text class="ucn" x="226.8" y="107" text-anchor="middle">UC1</text><text class="uct" x="226.8" y="122" text-anchor="middle">Sign up / log in</text></g><g class="uc"><ellipse cx="388.4" cy="110" rx="74" ry="25"/><text class="ucn" x="388.4" y="107" text-anchor="middle">UC2</text><text class="uct" x="388.4" y="122" text-anchor="middle">First-time setup</text></g><g class="uc"><ellipse cx="550.0" cy="110" rx="74" ry="25"/><text class="ucn" x="550.0" y="107" text-anchor="middle">UC3</text><text class="uct" x="550.0" y="122" text-anchor="middle">Courses + chapters</text></g><g class="uc"><ellipse cx="711.6" cy="110" rx="74" ry="25"/><text class="ucn" x="711.6" y="107" text-anchor="middle">UC4</text><text class="uct" x="711.6" y="122" text-anchor="middle">View curriculum</text></g><g class="uc"><ellipse cx="873.1999999999999" cy="110" rx="74" ry="25"/><text class="ucn" x="873.1999999999999" y="107" text-anchor="middle">UC5</text><text class="uct" x="873.1999999999999" y="122" text-anchor="middle">Add sources</text></g><g class="uc ai"><ellipse cx="375" cy="210" rx="168" ry="17"/><text class="uct" x="375" y="214" text-anchor="middle"><tspan class="ucn">UC6  </tspan><tspan class="aim">✦ </tspan>Build a question set</text></g><g class="uc"><ellipse cx="375" cy="252" rx="168" ry="17"/><text class="uct" x="375" y="256" text-anchor="middle"><tspan class="ucn">UC7  </tspan>Set timer, open lobby</text></g><g class="uc ai"><ellipse cx="375" cy="294" rx="168" ry="17"/><text class="uct" x="375" y="298" text-anchor="middle"><tspan class="ucn">UC10  </tspan><tspan class="aim">✦ </tspan>Mark answers</text></g><g class="uc ai"><ellipse cx="375" cy="336" rx="168" ry="17"/><text class="uct" x="375" y="340" text-anchor="middle"><tspan class="ucn">UC12  </tspan><tspan class="aim">✦ </tspan>See results</text></g><g class="uc ai"><ellipse cx="375" cy="378" rx="168" ry="17"/><text class="uct" x="375" y="382" text-anchor="middle"><tspan class="ucn">UC13  </tspan><tspan class="aim">✦ </tspan>Make practice from weak spots</text></g><g class="uc"><ellipse cx="780" cy="228" rx="130" ry="17"/><text class="uct" x="780" y="232" text-anchor="middle"><tspan class="ucn">UC8  </tspan>Join with QR or code</text></g><g class="uc"><ellipse cx="780" cy="290" rx="130" ry="17"/><text class="uct" x="780" y="294" text-anchor="middle"><tspan class="ucn">UC9  </tspan>Answer before time’s up</text></g><g class="uc"><ellipse cx="780" cy="352" rx="130" ry="17"/><text class="uct" x="780" y="356" text-anchor="middle"><tspan class="ucn">UC11  </tspan>Reveal answers</text></g><g class="uc ai"><ellipse cx="375" cy="466" rx="168" ry="17"/><text class="uct" x="375" y="470" text-anchor="middle"><tspan class="ucn">UC14  </tspan><tspan class="aim">✦ </tspan>Make notes or slides</text></g><g class="uc ai"><ellipse cx="375" cy="508" rx="168" ry="17"/><text class="uct" x="375" y="512" text-anchor="middle"><tspan class="ucn">UC15  </tspan><tspan class="aim">✦ </tspan>Make a quiz, test or exam</text></g><g class="uc ai"><ellipse cx="375" cy="550" rx="168" ry="17"/><text class="uct" x="375" y="554" text-anchor="middle"><tspan class="ucn">UC16  </tspan><tspan class="aim">✦ </tspan>Save an exam template</text></g><g class="uc ai"><ellipse cx="375" cy="592" rx="168" ry="17"/><text class="uct" x="375" y="596" text-anchor="middle"><tspan class="ucn">UC17  </tspan><tspan class="aim">✦ </tspan>Edit with Funza chat</text></g><g class="uc"><ellipse cx="375" cy="634" rx="168" ry="17"/><text class="uct" x="375" y="638" text-anchor="middle"><tspan class="ucn">UC18  </tspan>Review and approve</text></g><g class="uc"><ellipse cx="780" cy="470" rx="130" ry="17"/><text class="uct" x="780" y="474" text-anchor="middle"><tspan class="ucn">UC19  </tspan>Publish to student page</text></g><g class="uc"><ellipse cx="780" cy="522" rx="130" ry="17"/><text class="uct" x="780" y="526" text-anchor="middle"><tspan class="ucn">UC20  </tspan>Get materials</text></g><g class="uc"><ellipse cx="780" cy="574" rx="130" ry="17"/><text class="uct" x="780" y="578" text-anchor="middle"><tspan class="ucn">UC21  </tspan>Post to Google Classroom</text></g><g class="uc"><ellipse cx="780" cy="626" rx="130" ry="17"/><text class="uct" x="780" y="630" text-anchor="middle"><tspan class="ucn">UC22  </tspan>Print or save PDF</text></g><g class="actor"><circle cx="62" cy="306" r="10"/><path d="M62,316 L62,344 M47,326 L77,326 M62,344 L50,366 M62,344 L74,366"/></g><text class="aname" x="62.0" y="386.0" text-anchor="middle">Teacher</text><path class="ar assoc" d="M80.0,326.0 L146.0,98.0"/><path class="ar assoc" d="M80.0,326.0 L146.0,282.0"/><path class="ar assoc" d="M80.0,326.0 L146.0,541.0"/><g class="actor"><circle cx="1066" cy="366" r="10"/><path d="M1066,376 L1066,404 M1051,386 L1081,386 M1066,404 L1054,426 M1066,404 L1078,426"/></g><text class="aname" x="1066.0" y="446.0" text-anchor="middle">Student</text><path class="ar assoc" d="M1046.0,380.0 L910.0,228.0"/><path class="ar assoc" d="M1046.0,380.0 L910.0,290.0"/><path class="ar assoc" d="M1046.0,380.0 L910.0,352.0"/><path class="ar assoc" d="M1046.0,380.0 L910.0,522.0"/><g class="bx ext"><rect x="996" y="598" width="146" height="52" rx="9"/></g><text class="t" x="1069.0" y="620.0" text-anchor="middle">Google Classroom</text><text class="s" x="1069.0" y="636.0" text-anchor="middle">outside system</text><path class="ar assoc" d="M996.0,616.0 L910.0,576.0"/></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="476" class="dia" viewBox="0 0 1160 476" role="img" aria-label="Overview: a teacher signs up, sets up courses, then from Home either goes Live (source, questions, timer and lobby, students answer, reveal and results) or Prepares (courses and chapters, make, review, approve, publish). Students join live by QR and get published materials by QR, link or Google Classroom. Live uses course notes; live results feed practice materials."><style>svg{
  --bg: #f3f5f2;
  --card: #ffffff;
  --ink: #17212b;
  --muted: #586470;
  --line: #ced6d1;
  --live: #c9431d;
  --prep: #0b7469;
  --ai: #6a4bd6;
  --live-t: #fbebe5;
  --prep-t: #e2f1ee;
  --ai-t: #efebfc;
  --lane: #e9edea;
  --ok: #2c7a3a;   --ok-t: #e3f2e5;
  --warn: #9a6100; --warn-t: #fbf0dc;
  --none: #6b7580; --none-t: #eceff1;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;} svg{background:var(--card);} 

.dia text { font-family: var(--body); }
.bx rect { fill: var(--card); stroke: var(--line); stroke-width: 1.3; }
.bx.live rect { stroke: var(--live); }
.bx.prep rect { stroke: var(--prep); }
.bx.home rect { stroke: var(--ink); stroke-width: 1.6; }
.bx.ai rect { fill: var(--ai-t); stroke: var(--ai); stroke-dasharray: 5 3; }
.bx.stu rect { stroke: var(--ink); stroke-width: 1; }
.bx.ext rect { fill: var(--lane); stroke: var(--muted); stroke-dasharray: 3 3; }
.t { font-size: 12.5px; font-weight: 700; fill: var(--ink); }
.s { font-size: 11px; fill: var(--muted); }
.ar { fill: none; stroke: var(--muted); stroke-width: 1.4; }
.ar.dash { stroke-dasharray: 6 4; }
.ar.assoc { stroke: var(--ink); stroke-width: 1.1; }
.ahp { fill: var(--muted); }
.lb { fill: var(--card); stroke: var(--line); }
.lt { font-size: 10.5px; fill: var(--muted); }
.panel.live { fill: var(--live-t); }
.panel.prep { fill: var(--prep-t); }
.panel.stu { fill: none; stroke: var(--line); stroke-dasharray: 4 4; }
.plab { font-family: var(--display); font-size: 13px; font-weight: 800; letter-spacing: .08em; }
.plab.live { fill: var(--live); } .plab.prep { fill: var(--prep); } .plab.stu { fill: var(--ink); }
.pnote { font-size: 11.5px; fill: var(--muted); }
.lane { fill: none; }
.lane.l1 { fill: var(--lane); }
.lanel { font-family: var(--display); font-size: 14px; font-weight: 700; fill: var(--ink); }
.lanes { font-size: 10.5px; fill: var(--muted); }
.ph { font-size: 12px; font-weight: 700; fill: var(--ink); }
.st rect { fill: var(--bg); stroke: var(--line); }
.stt { font-size: 10.5px; fill: var(--muted); }
.sys { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.systitle { font-family: var(--display); font-size: 15px; font-weight: 800; fill: var(--ink); }
.grp { fill: none; stroke: var(--line); stroke-dasharray: 4 4; }
.gname { font-size: 12px; font-weight: 700; fill: var(--muted); letter-spacing: .04em; }
.uc ellipse { fill: var(--card); stroke: var(--ink); stroke-width: 1.1; }
.uc.ai ellipse { fill: var(--ai-t); stroke: var(--ai); }
.uct { font-size: 12px; fill: var(--ink); }
.ucn { font-size: 10.5px; fill: var(--muted); font-weight: 700; }
.aim { fill: var(--ai); }
.actor { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.aname { font-size: 13px; font-weight: 700; fill: var(--ink); }
</style><rect x="0" y="0" width="1160" height="476" fill="var(--card)"/><defs><marker id="ah-d1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="panel live" x="196" y="12" width="700" height="210" rx="14"/><rect class="panel prep" x="196" y="262" width="700" height="200" rx="14"/><rect class="panel stu" x="938" y="12" width="216" height="450" rx="14"/><text class="plab live" x="214.0" y="38.0" text-anchor="start">LIVE</text><text class="pnote" x="256.0" y="38.0" text-anchor="start">in class, answered on phones in real time</text><text class="plab prep" x="214.0" y="446.0" text-anchor="start">PREPARE</text><text class="pnote" x="290.0" y="446.0" text-anchor="start">not live: courses, notes, quizzes and exams</text><text class="plab stu" x="954.0" y="38.0" text-anchor="start">STUDENTS</text><text class="pnote" x="1034.0" y="38.0" text-anchor="start">phone, no account</text><g class="bx "><rect x="16.0" y="16.0" width="150.0" height="52.0" rx="9"/><text class="t" x="91.0" y="39.0" text-anchor="middle">Sign up or log in</text><text class="s" x="91.0" y="54.5" text-anchor="middle">teacher account</text></g><g class="bx "><rect x="16.0" y="96.0" width="150.0" height="80.0" rx="9"/><text class="t" x="91.0" y="119.5" text-anchor="middle">First-time setup</text><text class="s" x="91.0" y="135.0" text-anchor="middle">grades 10–12, subjects</text><text class="s" x="91.0" y="148.5" text-anchor="middle">pick courses</text><text class="s" x="91.0" y="162.0" text-anchor="middle">Classroom (optional)</text></g><g class="bx home"><rect x="16.0" y="206.0" width="150.0" height="80.0" rx="9"/><text class="t" x="91.0" y="229.5" text-anchor="middle">Home</text><text class="s" x="91.0" y="245.0" text-anchor="middle">Go live</text><text class="s" x="91.0" y="258.5" text-anchor="middle">Prepare</text><text class="s" x="91.0" y="272.0" text-anchor="middle">3 waiting for review</text></g><path class="ar " d="M91.0,68.0 L91.0,96.0" marker-end="url(#ah-d1)"/><path class="ar " d="M91.0,176.0 L91.0,206.0" marker-end="url(#ah-d1)"/><g class="bx live"><rect x="204.0" y="60.0" width="128.0" height="108.0" rx="9"/><text class="t" x="268.0" y="97.5" text-anchor="middle">Choose a source</text><text class="s" x="268.0" y="113.0" text-anchor="middle">upload PDF or notes</text><text class="s" x="268.0" y="126.5" text-anchor="middle">a course chapter</text><text class="s" x="268.0" y="140.0" text-anchor="middle">or a saved quiz</text></g><g class="bx live"><rect x="343.0" y="60.0" width="128.0" height="108.0" rx="9"/><text class="t" x="407.0" y="97.5" text-anchor="middle">Pick questions</text><text class="s" x="407.0" y="113.0" text-anchor="middle">Funza suggests 15</text><text class="s" x="407.0" y="126.5" text-anchor="middle">you keep, say, 8</text><text class="s" x="407.0" y="140.0" text-anchor="middle">edit any wording</text></g><g class="bx live"><rect x="482.0" y="60.0" width="128.0" height="108.0" rx="9"/><text class="t" x="546.0" y="97.5" text-anchor="middle">Timer + lobby</text><text class="s" x="546.0" y="113.0" text-anchor="middle">set 5 minutes</text><text class="s" x="546.0" y="126.5" text-anchor="middle">QR + code on screen</text><text class="s" x="546.0" y="140.0" text-anchor="middle">names appear</text></g><g class="bx live"><rect x="621.0" y="60.0" width="128.0" height="108.0" rx="9"/><text class="t" x="685.0" y="97.5" text-anchor="middle">Students answer</text><text class="s" x="685.0" y="113.0" text-anchor="middle">one shared clock</text><text class="s" x="685.0" y="126.5" text-anchor="middle">answers save</text><text class="s" x="685.0" y="140.0" text-anchor="middle">as they go</text></g><g class="bx live"><rect x="760.0" y="60.0" width="128.0" height="108.0" rx="9"/><text class="t" x="824.0" y="97.5" text-anchor="middle">Reveal + results</text><text class="s" x="824.0" y="113.0" text-anchor="middle">Funza marks</text><text class="s" x="824.0" y="126.5" text-anchor="middle">you press Reveal</text><text class="s" x="824.0" y="140.0" text-anchor="middle">see weak questions</text></g><path class="ar " d="M332.0,114.0 L343.0,114.0" marker-end="url(#ah-d1)"/><path class="ar " d="M471.0,114.0 L482.0,114.0" marker-end="url(#ah-d1)"/><path class="ar " d="M610.0,114.0 L621.0,114.0" marker-end="url(#ah-d1)"/><path class="ar " d="M749.0,114.0 L760.0,114.0" marker-end="url(#ah-d1)"/><g class="bx prep"><rect x="204.0" y="290.0" width="128.0" height="108.0" rx="9"/><text class="t" x="268.0" y="327.5" text-anchor="middle">Courses</text><text class="s" x="268.0" y="343.0" text-anchor="middle">chapters from the</text><text class="s" x="268.0" y="356.5" text-anchor="middle">Saskatchewan units</text><text class="s" x="268.0" y="370.0" text-anchor="middle">+ your own sources</text></g><g class="bx prep"><rect x="343.0" y="290.0" width="128.0" height="108.0" rx="9"/><text class="t" x="407.0" y="334.2" text-anchor="middle">Make</text><text class="s" x="407.0" y="349.8" text-anchor="middle">notes · quiz · test</text><text class="s" x="407.0" y="363.2" text-anchor="middle">exam · slides</text></g><g class="bx prep"><rect x="482.0" y="290.0" width="128.0" height="108.0" rx="9"/><text class="t" x="546.0" y="334.2" text-anchor="middle">Review</text><text class="s" x="546.0" y="349.8" text-anchor="middle">check every part</text><text class="s" x="546.0" y="363.2" text-anchor="middle">chat with Funza</text></g><g class="bx prep"><rect x="621.0" y="290.0" width="128.0" height="108.0" rx="9"/><text class="t" x="685.0" y="334.2" text-anchor="middle">Approve</text><text class="s" x="685.0" y="349.8" text-anchor="middle">locks the version</text><text class="s" x="685.0" y="363.2" text-anchor="middle">later edits make v2</text></g><g class="bx prep"><rect x="760.0" y="290.0" width="128.0" height="108.0" rx="9"/><text class="t" x="824.0" y="327.5" text-anchor="middle">Publish</text><text class="s" x="824.0" y="343.0" text-anchor="middle">student page (QR)</text><text class="s" x="824.0" y="356.5" text-anchor="middle">Google Classroom</text><text class="s" x="824.0" y="370.0" text-anchor="middle">print or PDF</text></g><path class="ar " d="M332.0,344.0 L343.0,344.0" marker-end="url(#ah-d1)"/><path class="ar " d="M471.0,344.0 L482.0,344.0" marker-end="url(#ah-d1)"/><path class="ar " d="M610.0,344.0 L621.0,344.0" marker-end="url(#ah-d1)"/><path class="ar " d="M749.0,344.0 L760.0,344.0" marker-end="url(#ah-d1)"/><path class="ar " d="M166.0,246.0 L183.0,246.0 L183.0,114.0 L204.0,114.0" marker-end="url(#ah-d1)"/><path class="ar " d="M166.0,246.0 L183.0,246.0 L183.0,344.0 L204.0,344.0" marker-end="url(#ah-d1)"/><path class="ar dash" d="M268.0,168.0 L268.0,290.0" marker-end="url(#ah-d1)"/><rect class="lb" x="213.6" y="233.0" width="108.9" height="18" rx="9"/><text class="lt" x="268.0" y="245.8" text-anchor="middle">uses course notes</text><path class="ar dash" d="M824.0,168.0 L824.0,240.0 L407.0,240.0 L407.0,290.0" marker-end="url(#ah-d1)"/><rect class="lb" x="526.9" y="231.0" width="177.3" height="18" rx="9"/><text class="lt" x="615.5" y="243.8" text-anchor="middle">make practice from weak spots</text><g class="bx stu"><rect x="950.0" y="60.0" width="192.0" height="108.0" rx="9"/><text class="t" x="1046.0" y="90.8" text-anchor="middle">Student joins live</text><text class="s" x="1046.0" y="106.2" text-anchor="middle">scan QR or type the code</text><text class="s" x="1046.0" y="119.8" text-anchor="middle">name + student number</text><text class="s" x="1046.0" y="133.2" text-anchor="middle">answer before 0:00</text><text class="s" x="1046.0" y="146.8" text-anchor="middle">see answers + own score</text></g><g class="bx stu"><rect x="950.0" y="290.0" width="192.0" height="108.0" rx="9"/><text class="t" x="1046.0" y="320.8" text-anchor="middle">Student gets materials</text><text class="s" x="1046.0" y="336.2" text-anchor="middle">scan the course QR,</text><text class="s" x="1046.0" y="349.8" text-anchor="middle">open the link, or</text><text class="s" x="1046.0" y="363.2" text-anchor="middle">open the Classroom post</text><text class="s" x="1046.0" y="376.8" text-anchor="middle">then view or download</text></g><path class="ar " d="M546.0,60.0 L546.0,49.0 L1046.0,49.0 L1046.0,60.0" marker-end="url(#ah-d1)"/><rect class="lb" x="768.4" y="40.0" width="63.3" height="18" rx="9"/><text class="lt" x="800.0" y="52.8" text-anchor="middle">QR + code</text><path class="ar " d="M888.0,114.0 L950.0,114.0" marker-end="url(#ah-d1)"/><rect class="lb" x="894.9" y="105.0" width="46.2" height="18" rx="9"/><text class="lt" x="918.0" y="117.8" text-anchor="middle">reveal</text><path class="ar " d="M888.0,344.0 L950.0,344.0" marker-end="url(#ah-d1)"/><rect class="lb" x="892.0" y="335.0" width="51.9" height="18" rx="9"/><text class="lt" x="918.0" y="347.8" text-anchor="middle">publish</text></svg>
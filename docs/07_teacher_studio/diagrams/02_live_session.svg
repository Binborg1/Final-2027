<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="482" class="dia" viewBox="0 0 1160 482" role="img" aria-label="Live session swimlane with lanes for teacher, Funza and students across seven phases: source, questions, lobby, answering, marking, reveal, results. Session state moves set up, lobby, answering, marking, revealed, closed."><style>svg{
  --bg: #f3f5f2;
  --card: #ffffff;
  --ink: #17212b;
  --muted: #586470;
  --line: #ced6d1;
  --live: #c9431d;
  --prep: #0b7469;
  --ai: #6a4bd6;
  --live-t: #fbebe5;
  --prep-t: #e2f1ee;
  --ai-t: #efebfc;
  --lane: #e9edea;
  --ok: #2c7a3a;   --ok-t: #e3f2e5;
  --warn: #9a6100; --warn-t: #fbf0dc;
  --none: #6b7580; --none-t: #eceff1;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;} svg{background:var(--card);} 

.dia text { font-family: var(--body); }
.bx rect { fill: var(--card); stroke: var(--line); stroke-width: 1.3; }
.bx.live rect { stroke: var(--live); }
.bx.prep rect { stroke: var(--prep); }
.bx.home rect { stroke: var(--ink); stroke-width: 1.6; }
.bx.ai rect { fill: var(--ai-t); stroke: var(--ai); stroke-dasharray: 5 3; }
.bx.stu rect { stroke: var(--ink); stroke-width: 1; }
.bx.ext rect { fill: var(--lane); stroke: var(--muted); stroke-dasharray: 3 3; }
.t { font-size: 12.5px; font-weight: 700; fill: var(--ink); }
.s { font-size: 11px; fill: var(--muted); }
.ar { fill: none; stroke: var(--muted); stroke-width: 1.4; }
.ar.dash { stroke-dasharray: 6 4; }
.ar.assoc { stroke: var(--ink); stroke-width: 1.1; }
.ahp { fill: var(--muted); }
.lb { fill: var(--card); stroke: var(--line); }
.lt { font-size: 10.5px; fill: var(--muted); }
.panel.live { fill: var(--live-t); }
.panel.prep { fill: var(--prep-t); }
.panel.stu { fill: none; stroke: var(--line); stroke-dasharray: 4 4; }
.plab { font-family: var(--display); font-size: 13px; font-weight: 800; letter-spacing: .08em; }
.plab.live { fill: var(--live); } .plab.prep { fill: var(--prep); } .plab.stu { fill: var(--ink); }
.pnote { font-size: 11.5px; fill: var(--muted); }
.lane { fill: none; }
.lane.l1 { fill: var(--lane); }
.lanel { font-family: var(--display); font-size: 14px; font-weight: 700; fill: var(--ink); }
.lanes { font-size: 10.5px; fill: var(--muted); }
.ph { font-size: 12px; font-weight: 700; fill: var(--ink); }
.st rect { fill: var(--bg); stroke: var(--line); }
.stt { font-size: 10.5px; fill: var(--muted); }
.sys { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.systitle { font-family: var(--display); font-size: 15px; font-weight: 800; fill: var(--ink); }
.grp { fill: none; stroke: var(--line); stroke-dasharray: 4 4; }
.gname { font-size: 12px; font-weight: 700; fill: var(--muted); letter-spacing: .04em; }
.uc ellipse { fill: var(--card); stroke: var(--ink); stroke-width: 1.1; }
.uc.ai ellipse { fill: var(--ai-t); stroke: var(--ai); }
.uct { font-size: 12px; fill: var(--ink); }
.ucn { font-size: 10.5px; fill: var(--muted); font-weight: 700; }
.aim { fill: var(--ai); }
.actor { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.aname { font-size: 13px; font-weight: 700; fill: var(--ink); }
</style><rect x="0" y="0" width="1160" height="482" fill="var(--card)"/><defs><marker id="ah-d2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="lane l0" x="0" y="60" width="1160" height="150"/><text class="lanel" x="12.0" y="86.0" text-anchor="start">Teacher</text><text class="lanes" x="12.0" y="102.0" text-anchor="start">laptop + projector</text><rect class="lane l1" x="0" y="210" width="1160" height="110"/><text class="lanel" x="12.0" y="236.0" text-anchor="start">Funza</text><text class="lanes" x="12.0" y="252.0" text-anchor="start">AI assistant</text><rect class="lane l2" x="0" y="320" width="1160" height="156"/><text class="lanel" x="12.0" y="346.0" text-anchor="start">Students</text><text class="lanes" x="12.0" y="362.0" text-anchor="start">phones, no account</text><text class="ph" x="186.0" y="22.0" text-anchor="middle">1  Source</text><text class="ph" x="334.0" y="22.0" text-anchor="middle">2  Questions</text><text class="ph" x="482.0" y="22.0" text-anchor="middle">3  Lobby</text><text class="ph" x="630.0" y="22.0" text-anchor="middle">4  Answering</text><text class="ph" x="778.0" y="22.0" text-anchor="middle">5  Marking</text><text class="ph" x="926.0" y="22.0" text-anchor="middle">6  Reveal</text><text class="ph" x="1074.0" y="22.0" text-anchor="middle">7  Results</text><g class="st"><rect x="231.0" y="31" width="58.0" height="19" rx="9.5"/><text class="stt" x="260.0" y="44.5" text-anchor="middle">set up</text></g><g class="st"><rect x="456.0" y="31" width="52.0" height="19" rx="9.5"/><text class="stt" x="482.0" y="44.5" text-anchor="middle">lobby</text></g><g class="st"><rect x="592.0" y="31" width="76.0" height="19" rx="9.5"/><text class="stt" x="630.0" y="44.5" text-anchor="middle">answering</text></g><g class="st"><rect x="746.0" y="31" width="64.0" height="19" rx="9.5"/><text class="stt" x="778.0" y="44.5" text-anchor="middle">marking</text></g><g class="st"><rect x="891.0" y="31" width="70.0" height="19" rx="9.5"/><text class="stt" x="926.0" y="44.5" text-anchor="middle">revealed</text></g><g class="st"><rect x="1045.0" y="31" width="58.0" height="19" rx="9.5"/><text class="stt" x="1074.0" y="44.5" text-anchor="middle">closed</text></g><g class="bx live"><rect x="118.0" y="76.0" width="136.0" height="118.0" rx="9"/><text class="t" x="186.0" y="118.5" text-anchor="middle">Choose a source</text><text class="s" x="186.0" y="134.0" text-anchor="middle">upload a PDF or notes</text><text class="s" x="186.0" y="147.5" text-anchor="middle">or a course chapter</text><text class="s" x="186.0" y="161.0" text-anchor="middle">or a saved quiz</text></g><g class="bx live"><rect x="266.0" y="76.0" width="136.0" height="118.0" rx="9"/><text class="t" x="334.0" y="111.8" text-anchor="middle">Pick questions</text><text class="s" x="334.0" y="127.2" text-anchor="middle">keep as many as you</text><text class="s" x="334.0" y="140.8" text-anchor="middle">want, edit wording,</text><text class="s" x="334.0" y="154.2" text-anchor="middle">set the timer, choose</text><text class="s" x="334.0" y="167.8" text-anchor="middle">name / student no.</text></g><g class="bx live"><rect x="414.0" y="76.0" width="136.0" height="118.0" rx="9"/><text class="t" x="482.0" y="111.8" text-anchor="middle">Open the lobby</text><text class="s" x="482.0" y="127.2" text-anchor="middle">QR + code on screen</text><text class="s" x="482.0" y="140.8" text-anchor="middle">names appear</text><text class="s" x="482.0" y="154.2" text-anchor="middle">remove a name</text><text class="s" x="482.0" y="167.8" text-anchor="middle">press Start</text></g><g class="bx live"><rect x="562.0" y="76.0" width="136.0" height="118.0" rx="9"/><text class="t" x="630.0" y="125.2" text-anchor="middle">Watch progress</text><text class="s" x="630.0" y="140.8" text-anchor="middle">21 of 28 answered</text><text class="s" x="630.0" y="154.2" text-anchor="middle">end early if all done</text></g><g class="bx live"><rect x="710.0" y="76.0" width="136.0" height="118.0" rx="9"/><text class="t" x="778.0" y="125.2" text-anchor="middle">Check marks</text><text class="s" x="778.0" y="140.8" text-anchor="middle">flip any short-answer</text><text class="s" x="778.0" y="154.2" text-anchor="middle">mark Funza got wrong</text></g><g class="bx live"><rect x="858.0" y="76.0" width="136.0" height="118.0" rx="9"/><text class="t" x="926.0" y="125.2" text-anchor="middle">Press Reveal</text><text class="s" x="926.0" y="140.8" text-anchor="middle">projector: answers</text><text class="s" x="926.0" y="154.2" text-anchor="middle">+ % who got each</text></g><g class="bx live"><rect x="1006.0" y="76.0" width="136.0" height="118.0" rx="9"/><text class="t" x="1074.0" y="111.8" text-anchor="middle">Results</text><text class="s" x="1074.0" y="127.2" text-anchor="middle">most-missed questions</text><text class="s" x="1074.0" y="140.8" text-anchor="middle">common wrong answers</text><text class="s" x="1074.0" y="154.2" text-anchor="middle">save · export CSV</text><text class="s" x="1074.0" y="167.8" text-anchor="middle">make practice</text></g><g class="bx ai"><rect x="118.0" y="228.0" width="136.0" height="76.0" rx="9"/><text class="t" x="186.0" y="256.2" text-anchor="middle">Drafts questions</text><text class="s" x="186.0" y="271.8" text-anchor="middle">multiple choice, T/F,</text><text class="s" x="186.0" y="285.2" text-anchor="middle">number, short answer</text></g><g class="bx ai"><rect x="710.0" y="228.0" width="136.0" height="76.0" rx="9"/><text class="t" x="778.0" y="249.5" text-anchor="middle">Marks answers</text><text class="s" x="778.0" y="265.0" text-anchor="middle">exact for MC, T/F</text><text class="s" x="778.0" y="278.5" text-anchor="middle">and numbers; Funza</text><text class="s" x="778.0" y="292.0" text-anchor="middle">marks short answers</text></g><g class="bx ai"><rect x="1006.0" y="228.0" width="136.0" height="76.0" rx="9"/><text class="t" x="1074.0" y="256.2" text-anchor="middle">Explains results</text><text class="s" x="1074.0" y="271.8" text-anchor="middle">what most missed</text><text class="s" x="1074.0" y="285.2" text-anchor="middle">and why</text></g><g class="bx stu"><rect x="414.0" y="338.0" width="136.0" height="120.0" rx="9"/><text class="t" x="482.0" y="374.8" text-anchor="middle">Join</text><text class="s" x="482.0" y="390.2" text-anchor="middle">scan QR or type code</text><text class="s" x="482.0" y="403.8" text-anchor="middle">name + student no.</text><text class="s" x="482.0" y="417.2" text-anchor="middle">“You’re in, wait for</text><text class="s" x="482.0" y="430.8" text-anchor="middle">your teacher”</text></g><g class="bx stu"><rect x="562.0" y="338.0" width="136.0" height="120.0" rx="9"/><text class="t" x="630.0" y="374.8" text-anchor="middle">Answer</text><text class="s" x="630.0" y="390.2" text-anchor="middle">questions on phone</text><text class="s" x="630.0" y="403.8" text-anchor="middle">clock counts down</text><text class="s" x="630.0" y="417.2" text-anchor="middle">answers save</text><text class="s" x="630.0" y="430.8" text-anchor="middle">as you go</text></g><g class="bx stu"><rect x="710.0" y="338.0" width="136.0" height="120.0" rx="9"/><text class="t" x="778.0" y="388.2" text-anchor="middle">Locked</text><text class="s" x="778.0" y="403.8" text-anchor="middle">answers can’t change</text><text class="s" x="778.0" y="417.2" text-anchor="middle">wait for the reveal</text></g><g class="bx stu"><rect x="858.0" y="338.0" width="136.0" height="120.0" rx="9"/><text class="t" x="926.0" y="388.2" text-anchor="middle">See answers</text><text class="s" x="926.0" y="403.8" text-anchor="middle">yours vs the correct</text><text class="s" x="926.0" y="417.2" text-anchor="middle">your score</text></g><path class="ar " d="M186.0,194.0 L186.0,228.0" marker-end="url(#ah-d2)"/><rect class="lb" x="151.5" y="202.0" width="69.0" height="18" rx="9"/><text class="lt" x="186.0" y="214.8" text-anchor=
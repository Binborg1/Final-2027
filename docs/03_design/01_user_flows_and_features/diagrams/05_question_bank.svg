<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="318" class="dia" viewBox="0 0 1160 318" role="img" aria-label="Question bank loop. Approved questions are saved to the chapter&#x27;s bank and live results set each question&#x27;s difficulty. The next quiz or exam takes from the bank first and Funza writes only the gaps; the next live session can pick questions straight from the bank. New questions are reviewed and then saved, and live answers come back as results."><style>svg{
  --bg: #f3f5f2;
  --card: #ffffff;
  --ink: #17212b;
  --muted: #586470;
  --line: #ced6d1;
  --live: #c9431d;
  --prep: #0b7469;
  --ai: #6a4bd6;
  --live-t: #fbebe5;
  --prep-t: #e2f1ee;
  --ai-t: #efebfc;
  --lane: #e9edea;
  --ok: #2c7a3a;   --ok-t: #e3f2e5;
  --warn: #9a6100; --warn-t: #fbf0dc;
  --none: #6b7580; --none-t: #eceff1;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;} svg{background:var(--card);} 

.dia text { font-family: var(--body); }
.bx rect { fill: var(--card); stroke: var(--line); stroke-width: 1.3; }
.bx.live rect { stroke: var(--live); }
.bx.prep rect { stroke: var(--prep); }
.bx.home rect { stroke: var(--ink); stroke-width: 1.6; }
.bx.ai rect { fill: var(--ai-t); stroke: var(--ai); stroke-dasharray: 5 3; }
.bx.stu rect { stroke: var(--ink); stroke-width: 1; }
.bx.ext rect { fill: var(--lane); stroke: var(--muted); stroke-dasharray: 3 3; }
.t { font-size: 12.5px; font-weight: 700; fill: var(--ink); }
.s { font-size: 11px; fill: var(--muted); }
.ar { fill: none; stroke: var(--muted); stroke-width: 1.4; }
.ar.dash { stroke-dasharray: 6 4; }
.ar.assoc { stroke: var(--ink); stroke-width: 1.1; }
.ahp { fill: var(--muted); }
.lb { fill: var(--card); stroke: var(--line); }
.lt { font-size: 10.5px; fill: var(--muted); }
.panel.live { fill: var(--live-t); }
.panel.prep { fill: var(--prep-t); }
.panel.stu { fill: none; stroke: var(--line); stroke-dasharray: 4 4; }
.plab { font-family: var(--display); font-size: 13px; font-weight: 800; letter-spacing: .08em; }
.plab.live { fill: var(--live); } .plab.prep { fill: var(--prep); } .plab.stu { fill: var(--ink); }
.pnote { font-size: 11.5px; fill: var(--muted); }
.lane { fill: none; }
.lane.l1 { fill: var(--lane); }
.lanel { font-family: var(--display); font-size: 14px; font-weight: 700; fill: var(--ink); }
.lanes { font-size: 10.5px; fill: var(--muted); }
.ph { font-size: 12px; font-weight: 700; fill: var(--ink); }
.st rect { fill: var(--bg); stroke: var(--line); }
.stt { font-size: 10.5px; fill: var(--muted); }
.sys { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.systitle { font-family: var(--display); font-size: 15px; font-weight: 800; fill: var(--ink); }
.grp { fill: none; stroke: var(--line); stroke-dasharray: 4 4; }
.gname { font-size: 12px; font-weight: 700; fill: var(--muted); letter-spacing: .04em; }
.uc ellipse { fill: var(--card); stroke: var(--ink); stroke-width: 1.1; }
.uc.ai ellipse { fill: var(--ai-t); stroke: var(--ai); }
.uct { font-size: 12px; fill: var(--ink); }
.ucn { font-size: 10.5px; fill: var(--muted); font-weight: 700; }
.aim { fill: var(--ai); }
.actor { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.aname { font-size: 13px; font-weight: 700; fill: var(--ink); }
</style><rect x="0" y="0" width="1160" height="318" fill="var(--card)"/><defs><marker id="ah-d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0 L10,5 L0,10 z"/></marker></defs><g class="bx prep"><rect x="16.0" y="44.0" width="210.0" height="80.0" rx="9"/><text class="t" x="121.0" y="74.2" text-anchor="middle">Review + approve</text><text class="s" x="121.0" y="89.8" text-anchor="middle">a quiz, test or exam</text><text class="s" x="121.0" y="103.2" text-anchor="middle">is approved</text></g><g class="bx live"><rect x="16.0" y="196.0" width="210.0" height="80.0" rx="9"/><text class="t" x="121.0" y="226.2" text-anchor="middle">Live session results</text><text class="s" x="121.0" y="241.8" text-anchor="middle">percent correct</text><text class="s" x="121.0" y="255.2" text-anchor="middle">for each question</text></g><g class="bx home"><rect x="430.0" y="34.0" width="300.0" height="252.0" rx="9"/><text class="t" x="580.0" y="116.5" text-anchor="middle">Question bank</text><text class="s" x="580.0" y="132.0" text-anchor="middle">Chemistry 30 · Chemical Equilibria</text><text class="s" x="580.0" y="145.5" text-anchor="middle"></text><text class="s" x="580.0" y="159.0" text-anchor="middle">142 questions</text><text class="s" x="580.0" y="172.5" text-anchor="middle">type, marks, outcome, answer</text><text class="s" x="580.0" y="186.0" text-anchor="middle">difficulty from your class</text><text class="s" x="580.0" y="199.5" text-anchor="middle">times used, last used</text><text class="s" x="580.0" y="213.0" text-anchor="middle">pinned to: Chem 30 unit test</text></g><g class="bx prep"><rect x="934.0" y="44.0" width="210.0" height="80.0" rx="9"/><text class="t" x="1039.0" y="74.2" text-anchor="middle">Next quiz or exam</text><text class="s" x="1039.0" y="89.8" text-anchor="middle">bank first, Funza</text><text class="s" x="1039.0" y="103.2" text-anchor="middle">writes only the gaps</text></g><g class="bx live"><rect x="934.0" y="196.0" width="210.0" height="80.0" rx="9"/><text class="t" x="1039.0" y="226.2" text-anchor="middle">Next live session</text><text class="s" x="1039.0" y="241.8" text-anchor="middle">pick questions</text><text class="s" x="1039.0" y="255.2" text-anchor="middle">straight from the bank</text></g><path class="ar " d="M226.0,84.0 L430.0,84.0" marker-end="url(#ah-d6)"/><rect class="lb" x="253.6" y="75.0" width="148.8" height="18" rx="9"/><text class="lt" x="328.0" y="87.8" text-anchor="middle">approved questions saved</text><path class="ar " d="M226.0,236.0 L430.0,236.0" marker-end="url(#ah-d6)"/><rect class="lb" x="250.8" y="227.0" width="154.5" height="18" rx="9"/><text class="lt" x="328.0" y="239.8" text-anchor="middle">% correct sets difficulty</text><path class="ar " d="M730.0,84.0 L934.0,84.0" marker-end="url(#ah-d6)"/><rect class="lb" x="791.8" y="75.0" width="80.4" height="18" rx="9"/><text class="lt" x="832.0" y="87.8" text-anchor="middle">reused first</text><path class="ar " d="M730.0,236.0 L934.0,236.0" marker-end="url(#ah-d6)"/><rect class="lb" x="783.2" y="227.0" width="97.5" height="18" rx="9"/><text class="lt" x="832.0" y="239.8" text-anchor="middle">reused in class</text><path class="ar dash" d="M1039.0,44.0 L1039.0,18.0 L121.0,18.0 L121.0,44.0" marker-end="url(#ah-d6)"/><rect class="lb" x="465.7" y="9.0" width="228.6" height="18" rx="9"/><text class="lt" x="580.0" y="21.8" text-anchor="middle">new questions are reviewed, then saved</text><path class="ar dash" d="M1039.0,276.0 L1039.0,302.0 L121.0,302.0 L121.0,276.0" marker-end="url(#ah-d6)"/><rect class="lb" x="477.1" y="293.0" width="205.8" height="18" rx="9"/><text class="lt" x="580.0" y="305.8" text-anchor="middle">students answer, results come back</text></svg>
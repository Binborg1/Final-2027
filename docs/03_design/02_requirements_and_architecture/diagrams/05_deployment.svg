<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="330" class="dia" viewBox="0 0 1160 330" role="img" aria-label="Deployment pipeline. Build: code on a laptop against the dev database, pushed as a pull request. Check: GitHub Actions runs lint, types and tests while Vercel builds a preview on the dev database. Release: merging to main applies database migrations to Supabase production and Vercel deploys production, which reads and writes the production database in Canada."><style>svg{
  --bg: #f3f5f2;
  --card: #ffffff;
  --ink: #17212b;
  --muted: #586470;
  --line: #ced6d1;
  --live: #c9431d;
  --prep: #0b7469;
  --ai: #6a4bd6;
  --live-t: #fbebe5;
  --prep-t: #e2f1ee;
  --ai-t: #efebfc;
  --lane: #e9edea;
  --ok: #2c7a3a;   --ok-t: #e3f2e5;
  --warn: #9a6100; --warn-t: #fbf0dc;
  --none: #6b7580; --none-t: #eceff1;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;} svg{background:var(--card);} 

.dia text { font-family: var(--body); }
.bx rect { fill: var(--card); stroke: var(--line); stroke-width: 1.3; }
.bx.live rect { stroke: var(--live); }
.bx.prep rect { stroke: var(--prep); }
.bx.home rect { stroke: var(--ink); stroke-width: 1.6; }
.bx.ai rect { fill: var(--ai-t); stroke: var(--ai); stroke-dasharray: 5 3; }
.bx.stu rect { stroke: var(--ink); stroke-width: 1; }
.bx.ext rect { fill: var(--lane); stroke: var(--muted); stroke-dasharray: 3 3; }
.t { font-size: 12.5px; font-weight: 700; fill: var(--ink); }
.s { font-size: 11px; fill: var(--muted); }
.ar { fill: none; stroke: var(--muted); stroke-width: 1.4; }
.ar.dash { stroke-dasharray: 6 4; }
.ar.assoc { stroke: var(--ink); stroke-width: 1.1; }
.ahp { fill: var(--muted); }
.lb { fill: var(--card); stroke: var(--line); }
.lt { font-size: 10.5px; fill: var(--muted); }
.panel.live { fill: var(--live-t); }
.panel.prep { fill: var(--prep-t); }
.panel.stu { fill: none; stroke: var(--line); stroke-dasharray: 4 4; }
.plab { font-family: var(--display); font-size: 13px; font-weight: 800; letter-spacing: .08em; }
.plab.live { fill: var(--live); } .plab.prep { fill: var(--prep); } .plab.stu { fill: var(--ink); }
.pnote { font-size: 11.5px; fill: var(--muted); }
.lane { fill: none; }
.lane.l1 { fill: var(--lane); }
.lanel { font-family: var(--display); font-size: 14px; font-weight: 700; fill: var(--ink); }
.lanes { font-size: 10.5px; fill: var(--muted); }
.ph { font-size: 12px; font-weight: 700; fill: var(--ink); }
.st rect { fill: var(--bg); stroke: var(--line); }
.stt { font-size: 10.5px; fill: var(--muted); }
.sys { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.systitle { font-family: var(--display); font-size: 15px; font-weight: 800; fill: var(--ink); }
.grp { fill: none; stroke: var(--line); stroke-dasharray: 4 4; }
.gname { font-size: 12px; font-weight: 700; fill: var(--muted); letter-spacing: .04em; }
.uc ellipse { fill: var(--card); stroke: var(--ink); stroke-width: 1.1; }
.uc.ai ellipse { fill: var(--ai-t); stroke: var(--ai); }
.uct { font-size: 12px; fill: var(--ink); }
.ucn { font-size: 10.5px; fill: var(--muted); font-weight: 700; }
.aim { fill: var(--ai); }
.actor { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.aname { font-size: 13px; font-weight: 700; fill: var(--ink); }
.zone { fill: var(--bg); stroke: var(--line); }
.plab.ink { fill: var(--ink); }
.ll { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
.ml { font-size: 11px; fill: var(--ink); paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; }
.sep { stroke: var(--line); stroke-width: 1; }
.sepl { font-family: var(--display); font-size: 12px; font-weight: 800; letter-spacing: .06em; fill: var(--live); }
.nt rect { fill: var(--lane); stroke: var(--line); }
.ntt { font-size: 10.5px; fill: var(--ink); }
.et .body { fill: var(--card); stroke: var(--line); stroke-width: 1.3; }
.et.live .body { stroke: var(--live); } .et.prep .body { stroke: var(--prep); } .et.ai .body { stroke: var(--ai); }
.et.home .body { stroke: var(--ink); stroke-width: 1.7; }
.et .hd { fill: var(--lane); }
.et.live .hd { fill: var(--live-t); } .et.prep .hd { fill: var(--prep-t); } .et.ai .hd { fill: var(--ai-t); }
.etn { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: var(--ink); }
.etf { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 11px; fill: var(--muted); }
.lgd { font-size: 11px; fill: var(--muted); }
</style><rect x="0" y="0" width="1160" height="330" fill="var(--card)"/><defs><marker id="ah-a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0 L10,5 L0,10 z"/></marker></defs><text class="ph" x="186.0" y="18.0" text-anchor="middle">1  Build</text><text class="ph" x="471.0" y="18.0" text-anchor="middle">2  Check</text><text class="ph" x="865.0" y="18.0" text-anchor="middle">3  Release</text><g class="bx "><rect x="16.0" y="80.0" width="150.0" height="80.0" rx="9"/><text class="t" x="91.0" y="110.2" text-anchor="middle">Your laptop</text><text class="s" x="91.0" y="125.8" text-anchor="middle">npm run dev</text><text class="s" x="91.0" y="139.2" text-anchor="middle">keys in .env.local</text></g><g class="bx prep"><rect x="206.0" y="80.0" width="150.0" height="80.0" rx="9"/><text class="t" x="281.0" y="110.2" text-anchor="middle">Pull request</text><text class="s" x="281.0" y="125.8" text-anchor="middle">one feature</text><text class="s" x="281.0" y="139.2" text-anchor="middle">per branch</text></g><g class="bx "><rect x="396.0" y="30.0" width="150.0" height="70.0" rx="9"/><text class="t" x="471.0" y="62.0" text-anchor="middle">GitHub Actions</text><text class="s" x="471.0" y="77.5" text-anchor="middle">lint, types, tests</text></g><g class="bx "><rect x="396.0" y="140.0" width="150.0" height="70.0" rx="9"/><text class="t" x="471.0" y="165.2" text-anchor="middle">Vercel preview</text><text class="s" x="471.0" y="180.8" text-anchor="middle">its own URL,</text><text class="s" x="471.0" y="194.2" text-anchor="middle">dev database</text></g><g class="bx prep"><rect x="586.0" y="80.0" width="150.0" height="80.0" rx="9"/><text class="t" x="661.0" y="117.0" text-anchor="middle">Merge to main</text><text class="s" x="661.0" y="132.5" text-anchor="middle">after review</text></g><g class="bx "><rect x="776.0" y="30.0" width="150.0" height="70.0" rx="9"/><text class="t" x="851.0" y="55.2" text-anchor="middle">Migrations</text><text class="s" x="851.0" y="70.8" text-anchor="middle">supabase db push</text><text class="s" x="851.0" y="84.2" text-anchor="middle">to production</text></g><g class="bx home"><rect x="776.0" y="140.0" width="150.0" height="70.0" rx="9"/><text class="t" x="851.0" y="172.0" text-anchor="middle">Vercel production</text><text class="s" x="851.0" y="187.5" text-anchor="middle">Montréal functions</text></g><g class="bx home"><rect x="966.0" y="30.0" width="178.0" height="70.0" rx="9"/><text class="t" x="1055.0" y="62.0" text-anchor="middle">Supabase production</text><text class="s" x="1055.0" y="77.5" text-anchor="middle">Canada · real classes</text></g><g class="bx "><rect x="206.0" y="250.0" width="150.0" height="64.0" rx="9"/><text class="t" x="281.0" y="279.0" text-anchor="middle">Supabase dev</text><text class="s" x="281.0" y="294.5" text-anchor="middle">Canada · made-up data</text></g><path class="ar " d="M166.0,120.0 L206.0,120.0" marker-end="url(#ah-a5)"/><rect class="lb" x="168.6" y="111.0" width="34.8" height="18" rx="9"/><text class="lt" x="186.0" y="123.8" text-anchor="middle">push</text><path class="ar " d="M356.0,120.0 L376.0,120.0 L376.0,65.0 L396.0,65.0" marker-end="url(#ah-a5)"/><path class="ar " d="M376.0,120.0 L376.0,175.0 L396.0,175.0" marker-end="url(#ah-a5)"/><path class="ar " d="M546.0,65.0 L566.0,65.0 L566.0,120.0 L586.0,120.0" marker-end="url(#ah-a5)"/><path class="ar " d="M546.0,175.0 L566.0,175.0 L566.0,120.0"/><path class="ar " d="M736.0,120.0 L756.0,120.0 L756.0,65.0 L776.0,65.0" marker-end="url(#ah-a5)"/><path class="ar " d="M756.0,120.0 L756.0,175.0 L776.0,175.0" marker-end="url(#ah-a5)"/><path class="ar " d="M926.0,65.0 L966.0,65.0" marker-end="url(#ah-a5)"/><path class="ar " d="M926.0,175.0 L1055.0,175.0 L1055.0,100.0" marker-end="url(#ah-a5)"/><rect class="lb" x="1003.4" y="131.0" width="103.2" height="18" rx="9"/><text class="lt" x="1055.0" y="143.8" text-anchor="middle">reads and writes</text><path class="ar " d="M91.0,160.0 L91.0,282.0 L206.0,282.0" marker-end="url(#ah-a5)"/><path class="ar " d="M471.0,210.0 L471.0,282.0 L356.0,282.0" marker-end="url(#ah-a5)"/><text class="pnote" x="586.0" y="268.0" text-anchor="start">Keys live only in Vercel’s environment settings and .env.local,</text><text class="pnote" x="586.0" y="286.0" text-anchor="start">never in the code or in anything sent to a browser.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="286" class="dia" viewBox="0 0 1160 286" role="img" aria-label="AI request path. The teacher asks; the API checks sign-in, ownership and the daily allowance; builds the prompt from curriculum outcomes, sources, template and bank questions without student names; Gemini returns JSON to a schema; the API validates it against the schema and Funza&#x27;s checks; saves a draft version and logs tokens; the teacher reviews. Branches: allowance used up stops politely, Gemini busy retries then asks to try again, and output that still fails shows the failed check."><style>svg{
  --bg: #f3f5f2;
  --card: #ffffff;
  --ink: #17212b;
  --muted: #586470;
  --line: #ced6d1;
  --live: #c9431d;
  --prep: #0b7469;
  --ai: #6a4bd6;
  --live-t: #fbebe5;
  --prep-t: #e2f1ee;
  --ai-t: #efebfc;
  --lane: #e9edea;
  --ok: #2c7a3a;   --ok-t: #e3f2e5;
  --warn: #9a6100; --warn-t: #fbf0dc;
  --none: #6b7580; --none-t: #eceff1;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;} svg{background:var(--card);} 

.dia text { font-family: var(--body); }
.bx rect { fill: var(--card); stroke: var(--line); stroke-width: 1.3; }
.bx.live rect { stroke: var(--live); }
.bx.prep rect { stroke: var(--prep); }
.bx.home rect { stroke: var(--ink); stroke-width: 1.6; }
.bx.ai rect { fill: var(--ai-t); stroke: var(--ai); stroke-dasharray: 5 3; }
.bx.stu rect { stroke: var(--ink); stroke-width: 1; }
.bx.ext rect { fill: var(--lane); stroke: var(--muted); stroke-dasharray: 3 3; }
.t { font-size: 12.5px; font-weight: 700; fill: var(--ink); }
.s { font-size: 11px; fill: var(--muted); }
.ar { fill: none; stroke: var(--muted); stroke-width: 1.4; }
.ar.dash { stroke-dasharray: 6 4; }
.ar.assoc { stroke: var(--ink); stroke-width: 1.1; }
.ahp { fill: var(--muted); }
.lb { fill: var(--card); stroke: var(--line); }
.lt { font-size: 10.5px; fill: var(--muted); }
.panel.live { fill: var(--live-t); }
.panel.prep { fill: var(--prep-t); }
.panel.stu { fill: none; stroke: var(--line); stroke-dasharray: 4 4; }
.plab { font-family: var(--display); font-size: 13px; font-weight: 800; letter-spacing: .08em; }
.plab.live { fill: var(--live); } .plab.prep { fill: var(--prep); } .plab.stu { fill: var(--ink); }
.pnote { font-size: 11.5px; fill: var(--muted); }
.lane { fill: none; }
.lane.l1 { fill: var(--lane); }
.lanel { font-family: var(--display); font-size: 14px; font-weight: 700; fill: var(--ink); }
.lanes { font-size: 10.5px; fill: var(--muted); }
.ph { font-size: 12px; font-weight: 700; fill: var(--ink); }
.st rect { fill: var(--bg); stroke: var(--line); }
.stt { font-size: 10.5px; fill: var(--muted); }
.sys { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.systitle { font-family: var(--display); font-size: 15px; font-weight: 800; fill: var(--ink); }
.grp { fill: none; stroke: var(--line); stroke-dasharray: 4 4; }
.gname { font-size: 12px; font-weight: 700; fill: var(--muted); letter-spacing: .04em; }
.uc ellipse { fill: var(--card); stroke: var(--ink); stroke-width: 1.1; }
.uc.ai ellipse { fill: var(--ai-t); stroke: var(--ai); }
.uct { font-size: 12px; fill: var(--ink); }
.ucn { font-size: 10.5px; fill: var(--muted); font-weight: 700; }
.aim { fill: var(--ai); }
.actor { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.aname { font-size: 13px; font-weight: 700; fill: var(--ink); }
.zone { fill: var(--bg); stroke: var(--line); }
.plab.ink { fill: var(--ink); }
.ll { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
.ml { font-size: 11px; fill: var(--ink); paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; }
.sep { stroke: var(--line); stroke-width: 1; }
.sepl { font-family: var(--display); font-size: 12px; font-weight: 800; letter-spacing: .06em; fill: var(--live); }
.nt rect { fill: var(--lane); stroke: var(--line); }
.ntt { font-size: 10.5px; fill: var(--ink); }
.et .body { fill: var(--card); stroke: var(--line); stroke-width: 1.3; }
.et.live .body { stroke: var(--live); } .et.prep .body { stroke: var(--prep); } .et.ai .body { stroke: var(--ai); }
.et.home .body { stroke: var(--ink); stroke-width: 1.7; }
.et .hd { fill: var(--lane); }
.et.live .hd { fill: var(--live-t); } .et.prep .hd { fill: var(--prep-t); } .et.ai .hd { fill: var(--ai-t); }
.etn { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: var(--ink); }
.etf { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 11px; fill: var(--muted); }
.lgd { font-size: 11px; fill: var(--muted); }
</style><rect x="0" y="0" width="1160" height="286" fill="var(--card)"/><defs><marker id="ah-a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0 L10,5 L0,10 z"/></marker></defs><g class="bx prep"><rect x="24.0" y="40.0" width="146.0" height="112.0" rx="9"/><text class="t" x="97.0" y="79.5" text-anchor="middle">Teacher asks</text><text class="s" x="97.0" y="95.0" text-anchor="middle">Make box or chat:</text><text class="s" x="97.0" y="108.5" text-anchor="middle">“quiz, Chapter 3,</text><text class="s" x="97.0" y="122.0" text-anchor="middle">20 questions”</text></g><g class="bx "><rect x="185.0" y="40.0" width="146.0" height="112.0" rx="9"/><text class="t" x="258.0" y="79.5" text-anchor="middle">Checks</text><text class="s" x="258.0" y="95.0" text-anchor="middle">signed in, owns it</text><text class="s" x="258.0" y="108.5" text-anchor="middle">allowance left</text><text class="s" x="258.0" y="122.0" text-anchor="middle">request is valid</text></g><g class="bx "><rect x="346.0" y="40.0" width="146.0" height="112.0" rx="9"/><text class="t" x="419.0" y="72.8" text-anchor="middle">Builds the prompt</text><text class="s" x="419.0" y="88.2" text-anchor="middle">chapter outcomes</text><text class="s" x="419.0" y="101.8" text-anchor="middle">sources + template</text><text class="s" x="419.0" y="115.2" text-anchor="middle">bank questions first</text><text class="s" x="419.0" y="128.8" text-anchor="middle">no student names</text></g><g class="bx ai"><rect x="507.0" y="40.0" width="146.0" height="112.0" rx="9"/><text class="t" x="580.0" y="86.2" text-anchor="middle">Gemini</text><text class="s" x="580.0" y="101.8" text-anchor="middle">JSON to a schema</text><text class="s" x="580.0" y="115.2" text-anchor="middle">streams back</text></g><g class="bx "><rect x="668.0" y="40.0" width="146.0" height="112.0" rx="9"/><text class="t" x="741.0" y="79.5" text-anchor="middle">Validates</text><text class="s" x="741.0" y="95.0" text-anchor="middle">schema + Funza checks</text><text class="s" x="741.0" y="108.5" text-anchor="middle">answers and coverage</text><text class="s" x="741.0" y="122.0" text-anchor="middle">one retry if broken</text></g><g class="bx "><rect x="829.0" y="40.0" width="146.0" height="112.0" rx="9"/><text class="t" x="902.0" y="86.2" text-anchor="middle">Saves</text><text class="s" x="902.0" y="101.8" text-anchor="middle">new draft version</text><text class="s" x="902.0" y="115.2" text-anchor="middle">tokens → ai_usage</text></g><g class="bx prep"><rect x="990.0" y="40.0" width="146.0" height="112.0" rx="9"/><text class="t" x="1063.0" y="79.5" text-anchor="middle">Teacher reviews</text><text class="s" x="1063.0" y="95.0" text-anchor="middle">edits, then approves;</text><text class="s" x="1063.0" y="108.5" text-anchor="middle">approved questions</text><text class="s" x="1063.0" y="122.0" text-anchor="middle">join the bank</text></g><path class="ar " d="M170.0,96.0 L185.0,96.0" marker-end="url(#ah-a3)"/><path class="ar " d="M331.0,96.0 L346.0,96.0" marker-end="url(#ah-a3)"/><path class="ar " d="M492.0,96.0 L507.0,96.0" marker-end="url(#ah-a3)"/><path class="ar " d="M653.0,96.0 L668.0,96.0" marker-end="url(#ah-a3)"/><path class="ar " d="M814.0,96.0 L829.0,96.0" marker-end="url(#ah-a3)"/><path class="ar " d="M975.0,96.0 L990.0,96.0" marker-end="url(#ah-a3)"/><g class="bx ext"><rect x="185.0" y="196.0" width="146.0" height="70.0" rx="9"/><text class="t" x="258.0" y="221.2" text-anchor="middle">Stops politely</text><text class="s" x="258.0" y="236.8" text-anchor="middle">allowance used up;</text><text class="s" x="258.0" y="250.2" text-anchor="middle">says when it resets</text></g><path class="ar dash" d="M258.0,152.0 L258.0,196.0" marker-end="url(#ah-a3)"/><g class="bx ext"><rect x="507.0" y="196.0" width="146.0" height="70.0" rx="9"/><text class="t" x="580.0" y="221.2" text-anchor="middle">Busy or down</text><text class="s" x="580.0" y="236.8" text-anchor="middle">retries twice, then</text><text class="s" x="580.0" y="250.2" text-anchor="middle">“try again shortly”</text></g><path class="ar dash" d="M580.0,152.0 L580.0,196.0" marker-end="url(#ah-a3)"/><g class="bx ext"><rect x="668.0" y="196.0" width="146.0" height="70.0" rx="9"/><text class="t" x="741.0" y="221.2" text-anchor="middle">Still broken</text><text class="s" x="741.0" y="236.8" text-anchor="middle">shows the failed check</text><text class="s" x="741.0" y="250.2" text-anchor="middle">for the teacher to fix</text></g><path class="ar dash" d="M741.0,152.0 L741.0,196.0" marker-end="url(#ah-a3)"/><text class="pnote" x="24.0" y="24.0" text-anchor="start">Every AI call takes the same path through the API</text></svg>
<text x="400.0" y="186" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#222222" text-anchor="start">Check this screenshot before it is sent</text>
<text x="400.0" y="208" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#777777" text-anchor="start">This is the only image that would leave your device, and only if you press Send.</text>
<rect x="400.0" y="222" width="472" height="150" rx="12" fill="#E6E6E6" stroke="#BBBBBB" stroke-width="1"/>
<text x="636.0" y="302" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#777777" text-anchor="middle">[ screenshot preview ]</text>
<rect x="400.0" y="386" width="472" height="62" rx="12" fill="#F5F5F5" stroke="#777777" stroke-width="1"/>
<text x="414.0" y="408" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12.5" font-weight="800" fill="#777777" text-anchor="start">Look for anything private</text>
<text x="414.0" y="428" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#777777" text-anchor="start">Names, messages, passwords, email, course material you may not share.</text>
<text x="400.0" y="474" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#222222" text-anchor="start">Your question about this screenshot</text>

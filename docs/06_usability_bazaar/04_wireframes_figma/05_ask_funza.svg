<text x="1002" y="146" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start">You&#x27;re in Computer Networks,</text>
<text x="1002" y="166" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start">concept 2 of 4. You&#x27;ve made one</text>
<text x="1002" y="186" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start">attempt. Want a hint, or shall I</text>
<text x="1002" y="206" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start">explain the diagram?</text>

<rect x="0" y="800" width="1280" height="200" rx="0" fill="#F5F5F5"/>
<line x1="0" y1="800" x2="1280" y2="800" stroke="#222222" stroke-width="1.5"/>
<text x="40" y="830" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#222222" text-anchor="start">What we want to learn</text>
<circle cx="51" cy="854" r="11" fill="#222222"/>
<text x="51" y="858" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="70" y="858" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12.5" fill="#222222"><tspan font-weight="700">Ask box.</tspan> Do they type, or use the buttons? Is it clear it knows the current question?</text>
<circle cx="51" cy="881" r="11" fill="#222222"/>
<text x="51" y="885" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="70" y="885" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12.5" fill="#222222"><tspan font-weight="700">Answer.</tspan> Useful, or just repeating the screen? Does it give away answers?</text>
<circle cx="51" cy="908" r="11" fill="#222222"/>
<text x="51" y="912" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="70" y="912" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12.5" fill="#222222"><tspan font-weight="700">Opt-in sharing.</tspan> Would they ever press this? What do they expect it to see?</text>
<circle cx="51" cy="935" r="11" fill="#222222"/>
<text x="51" y="939" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="70" y="939" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12.5" fill="#222222"><tspan font-weight="700">While sharing.</tspan> Is the indicator reassuring enough? Is Stop easy to find?</text>
<circle cx="51" cy="962" r="11" fill="#222222"/>
<text x="51" y="966" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="70" y="966" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12.5" fill="#222222"><tspan font-weight="700">Review before send.</tspan> Does the consent step feel like safety, or friction?</text>
<rect x="0.75" y="0.75" width="1278.5" height="998.5" rx="6" fill="none" stroke="#222222" stroke-width="1.5"/>

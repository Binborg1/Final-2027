<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000" font-family="Nunito, Inter, 'Segoe UI', sans-serif">
<title>3. Lesson — explain, ask, hint</title>
<rect x="0" y="0" width="1280" height="1000" fill="#FFFFFF"/>
<rect x="0" y="0" width="256" height="800" rx="0" fill="#F5F5F5"/>
<line x1="256" y1="0" x2="256" y2="800" stroke="#BBBBBB" stroke-width="1"/>
<circle cx="36" cy="40" r="15" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
<text x="60" y="47" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#222222" text-anchor="start">Funza</text>
<rect x="20" y="84" width="216" height="40" rx="20" fill="#E6E6E6"/>
<text x="40" y="109" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#222222" text-anchor="start">My courses</text>
<text x="40" y="157" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#777777" text-anchor="start">Progress</text>
<text x="296" y="48" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#777777" text-anchor="start">← Computer Networks</text>
<rect x="896" y="34" width="113" height="20" rx="10" fill="#FFFFFF" stroke="#777777" stroke-width="1"/>
<text x="952.5" y="48" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#777777" text-anchor="middle">Concept 2 of 4</text>
<rect x="296" y="64" width="660" height="10" rx="5" fill="#E6E6E6"/>
<rect x="296" y="64" width="231" height="10" rx="5" fill="#777777"/>
<rect x="296" y="86" width="660" height="36" rx="12" fill="#F5F5F5" stroke="#BBBBBB" stroke-width="1"/>
<rect x="308" y="94" width="59" height="20" rx="10" fill="#FFFFFF" stroke="#777777" stroke-width="1"/>
<text x="337.5" y="108" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#777777" text-anchor="middle">SAMPLE</text>
<text x="386" y="108" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#777777" text-anchor="start">These lessons are built in, not from a PDF.</text>
<rect x="296" y="136" width="660" height="600" rx="20" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
<rect x="320" y="156" width="264" height="20" rx="10" fill="#FFFFFF" stroke="#777777" stroke-width="1"/>
<text x="452.0" y="170" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#777777" text-anchor="middle">HOW DATA TRAVELS ACROSS THE INTERNET</text>
<text x="320" y="200" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#222222" text-anchor="start">Messages are split into packets</text>
<rect x="320" y="220" width="612" height="7" rx="3" fill="#E6E6E6"/>
<rect x="320" y="234" width="612" height="7" rx="3" fill="#E6E6E6"/>
<rect x="320" y="248" width="306" height="7" rx="3" fill="#E6E6E6"/>
<line x1="320" y1="282" x2="932" y2="282" stroke="#BBBBBB" stroke-width="1"/>
<circle cx="336" cy="312" r="16" fill="#E6E6E6" stroke="#222222" stroke-width="1.5"/>
<text x="336" y="317" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#222222" text-anchor="middle">?</text>
<text x="364" y="310" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#222222" text-anchor="start">Apply it</text>
<circle cx="306" cy="296" r="11" fill="#222222"/>
<text x="306" y="300" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="364" y="332" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start">You send a message to a website. What happens to it before it arrives?</text>
<rect x="364" y="348" width="568" height="40" rx="12" fill="#FFFFFF" stroke="#777777" stroke-width="1" stroke-dasharray="5 4"/>
<text x="380" y="373" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#777777" text-anchor="start">(a) It goes as one big file directly to the website.</text>
<rect x="364" y="396" width="568" height="40" rx="12" fill="#E6E6E6" stroke="#222222" stroke-width="1.5"/>
<text x="380" y="421" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#222222" text-anchor="start">(b) It is split into small packets that may take different routes.</text>
<rect x="364" y="444" width="568" height="40" rx="12" fill="#FFFFFF" stroke="#777777" stroke-width="1" stroke-dasharray="5 4"/>
<text x="380" y="469" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#777777" text-anchor="start">(c) It is converted into a video and streamed.</text>
<rect x="364" y="500" width="180" height="36" rx="18" fill="#E6E6E6" stroke="#222222" stroke-width="1.5"/>
<text x="454.0" y="523" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#222222" text-anchor="middle">Check understanding</text>
<rect x="364" y="552" width="568" height="112" rx="14" fill="#F5F5F5" stroke="#777777" stroke-width="1" stroke-dasharray="5 4"/>
<circle cx="362" cy="550" r="11" fill="#222222"/>
<text x="362" y="554" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="380" y="576" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#777777" text-anchor="start">Not quite. Here&#x27;s a hint</text>
<rect x="380" y="586" width="536" height="7" rx="3" fill="#E6E6E6"/>
<rect x="380" y="598" width="375" height="7" rx="3" fill="#E6E6E6"/>
<text x="380" y="628" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#777777" text-anchor="start">Another way to think about it</text>
<rect x="380" y="638" width="536" height="7" rx="3" fill="#E6E6E6"/>
<rect x="380" y="650" width="322" height="7" rx="3" fill="#E6E6E6"/>
<rect x="364" y="676" width="104" height="36" rx="18" fill="#E6E6E6" stroke="#222222" stroke-width="1.5"/>
<text x="416.0" y="699" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#222222" text-anchor="middle">Try again</text>
<text x="484" y="699" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#777777" text-anchor="start">Attempt 1 of 3 before you can ask to see the answer.</text>
<circle cx="1080" cy="44" r="11" fill="#222222"/>
<text x="1080" y="48" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="1124.0" cy="70" r="34" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
<text x="1124.0" y="74" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#777777" text-anchor="middle">mascot</text>
<rect x="988" y="120" width="272" height="148" rx="14" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
<text x="1002" y="146" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start">Hey! Let&#x27;s figure this out together.</text>
<text x="1002" y="166" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start">Here&#x27;s the idea. When you send a</text>
<text x="1002" y="186" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start">message, your computer cuts it into</text>
<text x="1002" y="206" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start">packets … Now you try.</text>
<line x1="1002" y1="232" x2="1246" y2="232" stroke="#BBBBBB" stroke-width="1"/>
<rect x="1002" y="240" width="79" height="20" rx="10" fill="#FFFFFF" stroke="#777777" stroke-width="1"/>
<text x="1041.5" y="254" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#777777" text-anchor="middle">Voice off</text>
<rect x="1082" y="240" width="59" height="20" rx="10" fill="#FFFFFF" stroke="#777777" stroke-width="1"/>
<text x="1111.5" y="254" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#777777" text-anchor="middle">Replay</text>
<rect x="988" y="282" width="272" height="36" rx="18" fill="#E6E6E6" stroke="#222222" stroke-width="1.5"/>
<text x="1124.0" y="305" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#222222" text-anchor="middle">Start Tutor Mode</text>
<text x="1124.0" y="338" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">Funza talks you through the whole topic,</text>
<text x="1124.0" y="354" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">one step at a time.</text>
<circle cx="986" cy="280" r="11" fill="#222222"/>
<text x="986" y="284" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="988" y="372" width="272" height="134" rx="14" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
<text x="1004" y="394" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#222222" text-anchor="start">In this topic</text>
<circle cx="1012" cy="414" r="7" fill="#777777"/>
<text x="1028" y="418" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#777777" text-anchor="start">Messages are split into packets</text>
<circle cx="1012" cy="440" r="7" fill="#E6E6E6" stroke="#222222" stroke-width="1.5"/>
<text x="1028" y="444" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#222222" text-anchor="start">Why small pieces beat one big block</text>
<circle cx="1012" cy="466" r="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="1028" y="470" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#777777" text-anchor="start">Every packet carries an address</text>
<circle cx="1012" cy="492" r="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="1028" y="496" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#777777" text-anchor="start">Routers choose the path</text>
<rect x="0" y="800" width="1280" height="200" rx="0" fill="#F5F5F5"/>
<line x1="0" y1="800" x2="1280" y2="800" stroke="#222222" stroke-width="1.5"/>
<text x="40" y="830" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#222222" text-anchor="start">What we want to learn</text>
<circle cx="51" cy="854" r="11" fill="#222222"/>
<text x="51" y="858" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="70" y="858" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12.5" fill="#222222"><tspan font-weight="700">Mascot and bubble.</tspan> Tutor or gimmick? Do they turn the voice on?</text>
<circle cx="51" cy="881" r="11" fill="#222222"/>
<text x="51" y="885" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="70" y="885" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12.5" fill="#222222"><tspan font-weight="700">Tutor Mode.</tspan> Do they understand it narrates the whole topic and waits for them?</text>
<circle cx="51" cy="908" r="11" fill="#222222"/>
<text x="51" y="912" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="70" y="912" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12.5" fill="#222222"><tspan font-weight="700">Question.</tspan> Do they read the explanation first, or go straight to the options?</text>
<circle cx="51" cy="935" r="11" fill="#222222"/>
<text x="51" y="939" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="70" y="939" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12.5" fill="#222222"><tspan font-weight="700">Hint instead of answer.</tspan> Helpful or annoying? Is &quot;3 attempts before the answer&quot; fair?</text>
<rect x="0.75" y="0.75" width="1278.5" height="998.5" rx="6" fill="none" stroke="#222222" stroke-width="1.5"/>
</svg>

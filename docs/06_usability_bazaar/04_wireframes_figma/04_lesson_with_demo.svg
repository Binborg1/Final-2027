<text x="1028" y="378" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#222222" text-anchor="start">Messages are split into packets</text>
<circle cx="1012" cy="400" r="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="1028" y="404" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#777777" text-anchor="start">Why small pieces beat one big block</text>
<circle cx="1012" cy="426" r="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="1028" y="430" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#777777" text-anchor="start">Every packet carries an address</text>
<circle cx="1012" cy="452" r="7" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
<text x="1028" y="456" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#777777" text-anchor="start">Routers choose the path</text>
<rect x="0" y="800" width="1280" height="200" rx="0" fill="#F5F5F5"/>
<line x1="0" y1="800" x2="1280" y2="800" stroke="#222222" stroke-width="1.5"/>
<text x="40" y="830" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#222222" text-anchor="start">What we want to learn</text>
<circle cx="51" cy="854" r="11" fill="#222222"/>
<text x="51" y="858" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="70" y="858" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12.5" fill="#222222"><tspan font-weight="700">Animation.</tspan> Does the picture explain more than the text? Are the captions read?</text>
<circle cx="51" cy="881" r="11" fill="#222222"/>
<text x="51" y="885" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="70" y="885" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12.5" fill="#222222"><tspan font-weight="700">Prediction stop.</tspan> Do they realise the demo stopped on purpose, and that nothing is revealed until they answer?</text>
<circle cx="51" cy="908" r="11" fill="#222222"/>
<text x="51" y="912" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="70" y="912" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12.5" fill="#222222"><tspan font-weight="700">Mascot sync.</tspan> Does the mascot saying the same thing as the demo help, or feel like noise?</text>
<circle cx="51" cy="935" r="11" fill="#222222"/>
<text x="51" y="939" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="70" y="939" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12.5" fill="#222222"><tspan font-weight="700">Sliders.</tspan> Do they discover the settings? Do they try a second run?</text>

<text x="397" y="432" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#222222" text-anchor="middle">Sender</text>
<rect x="810" y="354" width="90" height="60" rx="12" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
<text x="855" y="432" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#222222" text-anchor="middle">Receiver</text>

<text x="1002" y="166" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start">the next part. The packets took</text>
<text x="1002" y="186" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start">different routes. Will they arrive</text>
<text x="1002" y="206" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#222222" text-anchor="start">in the order they were sent?</text>

<text x="336" y="290" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#222222" text-anchor="start">Packet transmission</text>
<text x="916" y="290" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#777777" text-anchor="end">Step 3 of 5</text>

<text x="408" y="468" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#222222" text-anchor="start">Each packet travels on its own. Routers forward them hop by hop, and packets can take different routes.</text>
<rect x="332" y="484" width="588" height="112" rx="14" fill="#FFFFFF" stroke="#777777" stroke-width="1" stroke-dasharray="5 4"/>
<circle cx="330" cy="482" r="11" fill="#222222"/>
<text x="330" y="486" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="346" y="506" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#777777" text-anchor="start">Predict what happens next</text>
<text x="346" y="526" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#222222" text-anchor="start">The packets took different routes. Will they arrive in the order they were sent?</text>
<circle cx="354" cy="548" r="5" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
<text x="366" y="552" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#777777" text-anchor="start">(a) Always. The network keeps packets in order.</text>
<circle cx="354" cy="568" r="5" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
<text x="366" y="572" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#777777" text-anchor="start">(b) Not necessarily. The receiver uses the sequence numbers.</text>
<circle cx="354" cy="588" r="5" fill="#FFFFFF" stroke="#222222" stroke-width="1.2"/>
<text x="366" y="592" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#777777" text-anchor="start">(c) They arrive in reverse order.</text>
<rect x="332" y="610" width="70" height="36" rx="18" fill="#E6E6E6" stroke="#222222" stroke-width="1.5"/>
<text x="367.0" y="633" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#222222" text-anchor="middle">Play</text>
<rect x="410" y="610" width="70" height="36" rx="18" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
<text x="445.0" y="633" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#222222" text-anchor="middle">Step</text>
<text x="498" y="633" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#777777" text-anchor="start">Reset</text>
<line x1="332" y1="660" x2="920" y2="660" stroke="#BBBBBB" stroke-width="1"/>
<circle cx="330" cy="658" r="11" fill="#222222"/>
<text x="330" y="662" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="342" y="678" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#777777" text-anchor="start">Packets</text>
<text x="582" y="678" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#222222" text-anchor="end">3</text>
<rect x="342" y="686" width="240" height="6" rx="3" fill="#E6E6E6"/>
<circle cx="402" cy="689" r="7" fill="#222222"/>
<text x="632" y="678" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#777777" text-anchor="start">Lose a packet</text>
<rect x="632" y="684" width="200" height="26" rx="10" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
<text x="644" y="702" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#222222" text-anchor="start">None</text>
<text x="820" y="702" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#777777" text-anchor="end">▾</text>
<text x="336" y="730" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#777777" text-anchor="start">▸ Read every step as text</text>
<circle cx="1124.0" cy="70" r="34" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
<text x="1124.0" y="74" font-family="Nunito, Inter, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#777777" text-anchor="middle">mascot</text>
